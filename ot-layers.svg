<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-label="OT architecture layers and matching simulator scenarios" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="860" height="440" rx="12" fill="#f3f5f8"/>
<text x="430" y="30" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#14202e">OT architecture layers and the scenario that teaches each one</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#fff" text-anchor="middle">
<rect x="80" y="55" width="400" height="52" rx="8" fill="#6b7c93"/><text x="280" y="86">Ship IT and shore (satcom, email)</text>
<rect x="100" y="115" width="360" height="52" rx="8" fill="#d12c2c"/><text x="280" y="146">IT/OT boundary (firewall, DMZ)</text>
<rect x="120" y="175" width="320" height="52" rx="8" fill="#c98a00"/><text x="280" y="206">Safety system (independent trips)</text>
<rect x="140" y="235" width="280" height="52" rx="8" fill="#0a6cc4"/><text x="280" y="266">L2 Supervisory (HMI, alarms)</text>
<rect x="160" y="295" width="240" height="52" rx="8" fill="#1a8a4a"/><text x="280" y="326">L1 Controllers (PLC)</text>
<rect x="180" y="355" width="200" height="52" rx="8" fill="#0b2540"/><text x="280" y="386">L0 Field devices</text></g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#14202e">
<g stroke="#5d6b7c" stroke-width="1.5" stroke-dasharray="4 3"><path d="M485 81H540M465 141H540M445 201H540M425 261H540M405 321H540M385 381H540"/></g>
<text x="548" y="86">Attack path starts here (cyber scenario)</text>
<text x="548" y="146">Isolate the IT/OT link</text>
<text x="548" y="206">Engine trips on the real temperature</text>
<text x="548" y="266">Alarm list and the spoofed HMI value</text>
<text x="548" y="326">Overload and blackout (power management)</text>
<text x="548" y="386">Sensors, pumps, valves, spoofed readings</text></g>
</svg>
